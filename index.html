
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA | Modern Clothing Brand</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">AURA.</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#shop">Shop</a></li>
      <li><a href="#about">About</a></li>
    </ul>
    <div class="nav-icons">
      <div class="auth-icon" id="auth-btn">
        <i class="fa-solid fa-user"></i>
        <span id="user-display">Login</span>
      </div>
      <div class="cart-icon" id="cart-btn">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="cart-count">0</span>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h1>ELEVATE YOUR STYLE</h1>
      <p>Discover the New Modern Essentials Collection</p>
      <a href="#shop" class="btn">Shop Collection</a>
    </div>
  </section>

  <!-- Product Section -->
  <section id="shop" class="products-section">
    <h2>Featured Products</h2>
    <div class="product-grid" id="product-grid">
      <!-- Dynamic Products loaded via JS -->
    </div>
  </section>

  <!-- Cart Drawer Overlay & Sidebar -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Your Shopping Bag</h3>
      <button id="close-cart">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <!-- Dynamic Cart Items loaded via JS -->
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-price">₹0.00</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Checkout</button>
    </div>
  </aside>

  <!-- Auth Modal -->
  <div class="auth-overlay" id="auth-overlay"></div>
  <div class="auth-modal" id="auth-modal">
    <button class="close-auth" id="close-auth">&times;</button>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Login</button>
      <button class="auth-tab" id="tab-register">Register</button>
    </div>
    
    <!-- Login Form -->
    <form id="login-form" class="auth-form active">
      <input type="text" id="login-username" placeholder="Username" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="btn btn-full">Login</button>
      <p class="auth-msg" id="login-msg"></p>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form">
      <input type="text" id="register-username" placeholder="Username" required>
      <input type="password" id="register-password" placeholder="Password" required>
      <button type="submit" class="btn btn-full">Register</button>
      <p class="auth-msg" id="register-msg"></p>
    </form>
    
    <!-- Logged in State -->
    <div id="logged-in-state" class="auth-form">
      <h3 id="welcome-msg">Welcome!</h3>
      <button id="logout-btn" class="btn btn-full">Logout</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 AURA Apparel. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
